    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var activeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return activeFetch; },
              set: function(newFetch) { if (typeof newFetch === 'function') { activeFetch = newFetch; } },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch setter patch notice:', e);
        }
      })();
    </script>
